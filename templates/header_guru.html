<!-- HEADER -->
<div class="header">
    <div class="header-left">
        <img src="{{ url_for('static', filename='icons/logo_sekolah1.png') }}"
            class="header-logo"
            alt="Logo Sekolah">
        
    </div>

    <div class="header-user">
        <div class="user-dropdown">
            <img id="user-photo" class="user-icon" alt="Foto User"
                src="{% if guru['foto'] %}{{ url_for('uploaded_file', filename=guru['foto']) }}?t={{ current_time }}{% else %}{{ url_for('static', filename='icons/admin.png') }}{% endif %}">
            <button class="dropbtn" type="button">
                Hai, {{ guru['nama'] }} ▾
            </button>

            <div class="dropdown-content">
                <a href="#" class="dropdown-item" id="Lihat-profile">Lihat Profil</a>
                <a href="/logout" class="dropdown-item logout">Logout</a>
            </div>
        </div>
    </div>
</div>

<!-- Modal Profile -->
<div id="modal-profile-overlay" class="modal-overlay" style="display:none;"></div>
<div id="modal-profile" class="modal-form profile-modal" style="display:none;">
    <h3>PROFIL GURU</h3>
    <div class="photo-upload-wrapper">
        <div class="photo-preview">
            <img id="profile-photo-preview" 
                src="{% if guru['foto'] %}{{ url_for('uploaded_file', filename=guru['foto']) }}{% else %}{{ url_for('static', filename='icons/admin.png') }}{% endif %}" 
                alt="Foto Profil">
        </div>

        <button id="edit-photo-btn" style="margin-top:10px;">Ganti Foto</button>
        <input type="file" id="photo-input" accept="image/*" hidden>
    </div>

    <div id="profile-content"></div>
    <!-- Data profil akan dimuat via JS -->
    
    <div class="modal-actions">
        <button id="modal-profile-close">Tutup</button>
    </div>
</div>

<!-- Crop Modal -->
<div id="crop-modal-overlay" class="modal-overlay" style="display:none;"></div>
<div id="crop-modal" class="modal-form" style="display:none; max-width:500px; padding:15px;">
    <h3>Crop Foto</h3>

    <div class="crop-container">
        <img id="cropper-image" style="max-width:100%; display:block;">
    </div>

    <div class="crop-actions" style="margin-top:10px; text-align:right;">
        <button id="change-photo">Ganti Foto</button>

        <div class="crop-bottom-row">
            <div class="crop-zoom">
                <button id="zoom-out">−</button>
                <button id="zoom-in">+</button>
            </div>

            <div class="crop-confirm">
                <button id="crop-cancel">Batal</button>
                <button id="crop-save">Simpan</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<div id="modal-photo-overlay" style="display:none;"></div>
<div id="modal-photo" style="display:none; text-align:center; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); max-width:90%; max-height:90%; z-index:10000; background:#fff; border-radius:12px; padding:10px;">
    
    <!-- Tombol kontrol -->
    <div style="text-align:right; margin-bottom:5px;">
        <button id="zoom-out-photo">−</button>
        <button id="zoom-in-photo">+</button>
        <button id="close-photo">✕</button>
    </div>
    
    <!-- Wrapper untuk membatasi gambar -->
    <div id="modal-photo-wrapper" style="width:100%; height:80vh; overflow:hidden; display:flex; justify-content:center; align-items:center; border-radius:12px; background:#f0f0f0;">
        <img id="modal-photo-img" src="" alt="Foto User" style="max-width:100%; max-height:100%; border-radius:12px; transition: transform 0.2s ease;">
    </div>
</div>
