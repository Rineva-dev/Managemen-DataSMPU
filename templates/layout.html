<!DOCTYPE html>
<html lang="id" class="preload">
<head>
<meta charset="UTF-8">
<meta name="language" content="id">
<meta http-equiv="Content-Language" content="id-ID">
<style>
html.preload {
    visibility: hidden;
}

html.preload body {
    opacity: 0;
}

html.preload * {
    transition: none !important;
    animation: none !important;
}
</style>
<script>
document.documentElement.classList.add("no-transition");
</script>
<script>
(function () {
    const html = document.documentElement;

    function unlock() {
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                html.classList.remove("preload");
            });
        });
    }

    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(unlock);
    } else {
        window.addEventListener("load", unlock);
    }

    // fallback absolut
    setTimeout(unlock, 1500);
})();
</script>
    <title>{{ role_title }} | SMP UH</title>
    <script>
    (function () {
        const html = document.documentElement;
        if (localStorage.getItem("sekolahMenuOpen") === "true") {
            html.classList.add("sekolah-open");
        }
    })();
    </script>

    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/table.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/filter.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modal.css') }}">

    {% block extra_css %}{% endblock %}
</head>

<div id="toast-container"></div>

<div id="confirm-modal" class="confirm-modal">
    <div class="confirm-box">

        <!-- ICON -->
        <div class="confirm-icon danger">
            <i data-lucide="trash-2"></i>
        </div>

        <!-- MESSAGE -->
        <p id="confirm-message"></p>

        <!-- ACTION -->
        <div class="confirm-actions">
            <button id="confirm-no" class="btn btn-cancel">Batal</button>
            <button id="confirm-yes" class="btn btn-danger">Hapus</button>
        </div>
    </div>
</div>
<script>
document.addEventListener("DOMContentLoaded", function() {
    const toggle = document.querySelector(".menu-toggle");
    if (!toggle) return;

    toggle.addEventListener("click", function() {
        const html = document.documentElement;
        const isOpen = html.classList.contains("sekolah-open");

        if (isOpen) {
            html.classList.remove("sekolah-open");
            localStorage.setItem("sekolahMenuOpen", "false");
        } else {
            html.classList.add("sekolah-open");
            localStorage.setItem("sekolahMenuOpen", "true");
        }
    });
});
</script>
<script>
document.addEventListener("DOMContentLoaded", function () {
    lucide.createIcons();
    document.body.classList.add("icons-ready");
});
</script>
</script>
</body>
</html>
