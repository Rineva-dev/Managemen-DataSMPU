<div id="jenis-pembayaran-content">

    <h3>Jenis Pembayaran</h3>

    <div class="filter-container pembayaran-filter-bar">

        <button class="btn btn-add" onclick="openTambahPembayaran()">
            Tambah Jenis Pembayaran
        </button>

    </div>

    <table class="table-jenis-pembayaran">
        <thead>
            <tr>
                <th>No</th>
                <th>Nama Pembayaran</th>
                <th>Keterangan</th>
                <th>Aksi</th>
            </tr>
        </thead>

        <tbody>
            {% for p in jenis_pembayaran %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ p.nama }}</td>
                <td>{{ p.keterangan or '-' }}</td>
                <td>
                    <button class="btn-small edit-btn">Edit</button>
                    <button class="btn-small delete-btn">Hapus</button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>


<!-- MODAL -->
<div id="modalPembayaran" class="saas-modal-overlay add-jenis">
    <form method="POST"
        action="{{ url_for('jenis_pembayaran.save') }}"
        class="saas-modal">

        <h3>Tambah Jenis Pembayaran</h3>

        <div class="form-group">
            <label>Nama Pembayaran</label>
            <input type="text"
                name="nama"
                placeholder="Contoh: SPP"
                required>
        </div>

        <div class="form-group">
            <label>Keterangan (Opsional)</label>
            <textarea name="keterangan"
                    placeholder="Contoh: Pembayaran bulanan siswa"></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-add">
                Simpan
            </button>

            <button type="button" class="btn btn-cancel" onclick="closeModal()">
                Batal
            </button>
        </div>

    </form>

</div>


<script src="{{ url_for('static', filename='js/keuangan/jenis-pembayaran.js') }}"></script>
