<div id="jenis-pembayaran-content">

    <h3>Jenis Pembayaran</h3>

    <div class="filter-container pembayaran-filter-bar">

        <button class="btn btn-add" onclick="openTambahPembayaran()">
            Tambah Jenis Pembayaran
        </button>

    </div>

    <table class="table-jenis-pembayaran">
        <thead>
            <tr>
                <th>No</th>
                <th>Nama Pembayaran</th>
                <th>Kode Pembayaran</th>
                <th>Kategori</th>
                <th>Status</th>
                <th>Aksi</th>
            </tr>
        </thead>

        <tbody>
            {% for p in jenis_pembayaran %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ p.nama }}</td>
                <td>{{ p.kode }}</td>
                <td>{{ p.kategori }}</td>
                <td>
                    {% if p.aktif %}
                        <span class="badge success">Aktif</span>
                    {% else %}
                        <span class="badge danger">Nonaktif</span>
                    {% endif %}
                </td>
                <td>
                    <button class="btn-small edit-btn"><i data-lucide="pencil"></i></button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>


<!-- MODAL -->
<div id="modalJenisPembayaran" class="saas-modal-overlay">
    <form method="POST"
        action="{{ url_for('jenis_pembayaran.save') }}"
        class="saas-modal add-akun-modern">

        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <h3>Tambah Jenis Pembayaran</h3>

        <div class="form-group">
            <label>Nama Pembayaran</label>
            <input type="text"
                name="nama"
                placeholder="Contoh: SPP"
                required>
        </div>

        <div class="form-group">
            <label>Kode Pembayaran</label>
            <input type="text"
                name="kode"
                placeholder="contoh: spp"
                required>
        </div>

        <div class="form-group">
            <label>Kategori</label>

            <select name="kategori" required>
                <option value="bulanan">Bulanan</option>
                <option value="tahunan">Tahunan</option>
                <option value="sekali">Sekali Bayar</option>
                <option value="cicilan">Cicilan</option>
                <option value="ekskul">Ekstrakurikuler</option>
            </select>
        </div>

        <div class="form-group">
            <label>Status</label>

            <select name="aktif">
                <option value="1">Aktif</option>
                <option value="0">Nonaktif</option>
            </select>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-add">
                Simpan
            </button>

            <button type="button" class="btn btn-cancel" onclick="closeModal()">
                Batal
            </button>
        </div>

    </form>

</div>


<script src="{{ url_for('static', filename='js/keuangan/jenis-pembayaran.js') }}"></script>
