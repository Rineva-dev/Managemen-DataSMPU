<div id="setting-pembayaran-content">

    <h3>Setting Tagihan Pembayaran Siswa</h3>

    <div class="filter-container pembayaran-filter-bar">

        <button class="btn btn-add" onclick="openTambahPembayaran()">
            Tambah Pembayaran
        </button>

    </div>

    <table class="table mt-3">
        <thead>
            <tr>
                <th>No</th>
                <th>Nama Pembayaran</th>
                <th>Kode</th>
                <th>Nominal</th>
                <th>Tipe</th>
                <th>Status</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody>
            {% for p in pembayaran %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ p.nama }}</td>
                <td>{{ p.kode }}</td>
                <td>Rp {{ "{:,}".format(p.nominal) }}</td>
                <td>{{ p.tipe }}</td>
                <td>
                    {% if p.aktif %}
                        <span class="badge success">Aktif</span>
                    {% else %}
                        <span class="badge danger">Nonaktif</span>
                    {% endif %}
                </td>
                <td>
                    <button class="btn-small">Edit</button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>

<div id="modalPembayaran" class="modal hidden">

    <form method="POST"
          action="{{ url_for('setting_pembayaran.save_jenis_pembayaran') }}"
          class="card">

        <h3>Tambah Jenis Pembayaran</h3>

        <div class="form-group">
            <label>Nama Pembayaran</label>
            <input type="text" name="nama" required>
        </div>

        <div class="form-group">
            <label>Kode</label>
            <input type="text" name="kode" placeholder="contoh: spp" required>
        </div>

        <div class="form-group">
            <label>Nominal</label>
            <input type="number" name="nominal" required>
        </div>

        <div class="form-group">
            <label>Tipe Pembayaran</label>
            <select name="tipe">
                <option value="bulanan">Bulanan</option>
                <option value="sekali">Sekali</option>
            </select>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">Simpan</button>
            <button type="button" onclick="closeModal()">Batal</button>
        </div>

    </form>

</div>

<script>
function openTambahPembayaran() {
    document.getElementById("modalPembayaran").classList.remove("hidden");
}

function closeModal() {
    document.getElementById("modalPembayaran").classList.add("hidden");
}
</script>
