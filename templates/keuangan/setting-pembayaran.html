<div id="setting-pembayaran-content">

    <h3>Setting Tagihan Pembayaran Siswa</h3>

    <div class="filter-container pembayaran-filter-bar">

        <button class="btn btn-add" onclick="openTambahPembayaran()">
            Tambah Pembayaran
        </button>

    </div>

    <table class="table-set-pembayaran">
        <thead>
            <tr>
                <th>No</th>
                <th>Nama Pembayaran</th>
                <th>Kode</th>
                <th>Nominal</th>
                <th>Tipe</th>
                <th>Status</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody>
            {% for p in pembayaran %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ p.nama }}</td>
                <td>{{ p.kode }}</td>
                <td>Rp {{ "{:,}".format(p.nominal) }}</td>
                <td>{{ p.tipe }}</td>
                <td>
                    {% if p.aktif %}
                        <span class="badge success">Aktif</span>
                    {% else %}
                        <span class="badge danger">Nonaktif</span>
                    {% endif %}
                </td>
                <td>
                    <button class="btn-small">Edit</button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>

<div id="modalPembayaran" class="saas-modal-overlay">

    <form method="POST"
          action="{{ url_for('setting_pembayaran.save_jenis_pembayaran') }}"
          class="saas-modal add-akun-modern">

        <input type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}">

        <h3>Tambah Jenis Pembayaran</h3>

        <div class="form-group">
            <label>Nama Pembayaran</label>
            <input type="text" name="nama" required>
        </div>

        <div class="form-group">
            <label>Kode</label>
            <input type="text" name="kode" placeholder="contoh: spp" required>
        </div>

        <div class="form-group">
            <label>Nominal</label>
            <input type="text"
                    id="nominal"
                    name="nominal"
                    placeholder="150.000"
                    required>
        </div>

        <div class="form-group">
            <label>Kategori Pembayaran</label>

            <select name="kategori" id="kategoriPembayaran">

                <option value="bulanan">Bulanan</option>

                <option value="tahunan">Tahunan</option>

                <option value="sekali">1x Bayar</option>

                <option value="termin">Cicilan / Termin</option>

            </select>
        </div>


        <div class="form-group" id="terminWrapper" style="display:none;">
            <label>Jumlah Termin</label>

            <input type="number"
                name="jumlah_termin"
                min="1"
                value="2">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-add">Simpan</button>
            <button type="button" class="btn btn-cancel" onclick="closeModal()">Batal</button>
        </div>

    </form>

</div>

<script>
function openTambahPembayaran() {
    document
        .getElementById("modalPembayaran")
        .classList.add("show");
}

function closeModal() {
    document
        .getElementById("modalPembayaran")
        .classList.remove("show");
}

const nominal = document.getElementById("nominal");

nominal.addEventListener("input", function () {

    let angka = this.value.replace(/\D/g, "");

    this.value = new Intl.NumberFormat("id-ID")
        .format(angka);
});

const kategori = document.getElementById("kategoriPembayaran");
const termin = document.getElementById("terminWrapper");

kategori.addEventListener("change", function () {

    if (this.value === "termin") {
        termin.style.display = "block";
    } else {
        termin.style.display = "none";
    }

});
</script>
