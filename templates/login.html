<!DOCTYPE html>
<html>
<head>
    <title>Login Absensi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="header">
    <h1>ABSENSI GURU</h1>
</div>

<div class="container">
    <img src="{{ url_for('static', filename='Logo Sekolah.png') }}" class="login-logo">

    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="input-group">
            👤
            <input type="text" name="username" placeholder="Username" value="{{ old_username if old_username else '' }}" required>
        </div>

        <div class="input-group">
            🔑
            <div class="password-wrapper">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Password"
                    value="{{ old_password if old_password else '' }}"
                    required
                >

                <span class="toggle-password" onclick="togglePassword()">
                    <svg id="eye-open" viewBox="0 0 24 24">
                        <path d="M12 5c-7.633 0-11 7-11 7s3.367 7 11 7 11-7 11-7-3.367-7-11-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/>
                    </svg>

                    <svg id="eye-closed" viewBox="0 0 24 24" style="display:none">
                        <path d="M1 4.27L2.28 3 21 21.72 19.73 23l-3.1-3.1A11.53 11.53 0 0 1 12 19c-7.63 0-11-7-11-7z"/>
                        <path d="M12 7a5 5 0 0 1 5 5c0 .64-.13 1.25-.36 1.82l-6.46-6.46z"/>
                    </svg>
                </span>
            </div>
        </div>
                
        {% if error %}
        <div class="login-error">
            {{ error }}
        </div>
        {% endif %}

        <div class="remember-me">
            <label class="checkbox-wrap">
                <input type="checkbox" name="remember">
                <span class="checkmark"></span>
                <span class="remember-text">Ingatkan Saya</span>
            </label>
        </div>

        <button>Login</button>
    </form>

    <div class="footer">
        Absensi Online Berbasis Wi-Fi
    </div>
</div>

<script>
function togglePassword() {
    const input = document.getElementById('password');
    const open = document.getElementById('eye-open');
    const closed = document.getElementById('eye-closed');

    if (input.type === 'password') {
        input.type = 'text';
        open.style.display = 'none';
        closed.style.display = 'block';
    } else {
        input.type = 'password';
        open.style.display = 'block';
        closed.style.display = 'none';
    }
}
localStorage.removeItem("activeMenu");
localStorage.removeItem("sekolahMenuOpen");
</script>

</body>
</html>
