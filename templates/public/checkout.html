<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Checkout Pembayaran
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/public/tagihan-siswa.css') }}">

</head>

<body class="billing-page">

<input
    type="hidden"
    id="siswa-id"
    value="{{ siswa_id }}">

<header class="market-header">

    <!-- LEFT -->
    <div class="market-left">

        <a href="/public/pembayaran" class="market-logo">
            <img src="{{ url_for('static', filename='img/logo-header.png') }}" alt="Logo">
        </a>

        <nav class="market-menu">

            <a href="/">Beranda</a>

            <a href="/public/payment">
                Pembayaran
            </a>

            <a href="/public/tagihan-siswa?siswa_id={{ siswa_id }}">
                Cek Tagihan
            </a>

            <a href="#">
                Kontak
            </a>

        </nav>

    </div>

    <!-- RIGHT -->
    <div class="market-actions">

        <div class="market-search">

            <i data-lucide="search"></i>

            <input
                type="text"
                placeholder="Cari tagihan...">

        </div>

        <button class="icon-button">

            <i data-lucide="bell"></i>

            <span class="icon-badge">
                2
            </span>

        </button>

        <!-- PROFIL -->
        <div class="profile-wrapper">
            <button class="profile-button" id="profile-btn">

                <i data-lucide="user"></i>

                <span id="nama-siswa-header">
                    ...
                </span>

            </button>

            <div class="profile-dropdown" id="profile-dropdown">

                <div class="profile-card">

                    <!-- HEADER -->
                    <div class="profile-header">
                        <div class="profile-avatar">
                            <i data-lucide="user"></i>
                        </div>

                        <div class="profile-header-info">
                            <h4 id="profile-nama">-</h4>
                            <small id="profile-nisn">NISN -</small>
                        </div>
                    </div>

                    <!-- INFO -->
                    <div class="profile-info-grid">
                        <div class="info-item">
                            <span>Kelas</span>
                            <strong id="profile-kelas">-</strong>
                        </div>
                        <div class="info-item">
                            <span>Status</span>
                            <strong id="profile-status" class="aktif">-</strong>
                        </div>
                        <div class="info-item full ttl">
                            <span>TTL</span>
                            <strong id="profile-ttl">-</strong>
                        </div>
                        <div class="info-item full">
                            <span>Orang Tua</span>
                            <strong id="profile-orangtua">-</strong>
                        </div>
                    </div>

                    <!-- FOOTER -->
                    <div class="profile-address">
                        <i data-lucide="map-pin"></i>
                        <p id="profile-alamat">-</p>
                    </div>

                </div>

            </div>
        </div>
    </div>

</header>

<div class="checkout-page">

    <div class="checkout-card">

        <div class="cart-header">

            <div>

                <small>
                    Keranjang Pembayaran
                </small>

                <h3>
                    Checkout
                </h3>

            </div>

        </div>

        <div class="cart-empty">

            <i data-lucide="shopping-cart"></i>

            <p>
                Belum ada tagihan dipilih
            </p>

        </div>

        <div class="cart-items">

        </div>

        <div class="cart-summary">

            <div class="summary-row">

                <span>
                    Total Pembayaran
                </span>

                <strong id="cart-total">
                    Rp 0
                </strong>

            </div>

            <button class="btn-checkout">

                <i data-lucide="credit-card"></i>

                <span>
                    Bayar Sekarang
                </span>

            </button>

        </div>

    </div>

</div>

<script src="https://unpkg.com/lucide@latest"></script>

<script>
    lucide.createIcons();
</script>

<script src="{{ url_for('static', filename='js/public/checkout.js') }}"></script>

</body>
</html>
