<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Tagihan Siswa
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/public/tagihan-siswa.css') }}">

</head>

<body class="billing-page">

<input type="hidden"
       id="siswa-id"
       value="{{ siswa_id }}">

<!-- =========================
     HEADER
========================= -->

<header class="market-header">

    <!-- LEFT -->
    <div class="market-left">

        <a href="/public/pembayaran" class="market-logo">
            <img src="{{ url_for('static', filename='img/logo-header.png') }}" alt="Logo">
        </a>

        <nav class="market-menu">

            <a href="/">Beranda</a>

            <a href="/public/payment">
                Pembayaran
            </a>

            <a href="#">
                Kontak
            </a>

        </nav>

    </div>

    <!-- RIGHT -->
    <div class="market-actions">

        <div class="market-search">

            <i data-lucide="search"></i>

            <input
                type="text"
                placeholder="Cari tagihan...">

        </div>

        <button class="icon-button">

            <i data-lucide="bell"></i>

            <span class="icon-badge">
                2
            </span>

        </button>

        <!-- CART -->
        <a href="/public/checkout?siswa_id={{ siswa_id }}" class="icon-button cart-button">

            <i data-lucide="shopping-cart"></i>

            <span class="icon-badge cart-count">
                0
            </span>

        </a>

        <!-- PROFILE -->
        <div class="profile-wrapper">
            <button class="profile-button" id="profile-btn">

                <i data-lucide="user"></i>

                <span id="nama-siswa-header">
                    ...
                </span>

            </button>

            <div class="profile-dropdown" id="profile-dropdown">

                <div class="profile-card">

                    <!-- HEADER -->
                    <div class="profile-header">
                        <div class="profile-avatar">
                            <i data-lucide="user"></i>
                        </div>

                        <div class="profile-header-info">
                            <h4 id="profile-nama">-</h4>
                            <small id="profile-nisn">NISN -</small>
                        </div>
                    </div>

                    <!-- INFO -->
                    <div class="profile-info-grid">
                        <div class="info-item">
                            <span>Kelas</span>
                            <strong id="profile-kelas">-</strong>
                        </div>
                        <div class="info-item">
                            <span>Status</span>
                            <strong id="profile-status">-</strong>
                        </div>
                        <div class="info-item full">
                            <span>TTL</span>
                            <strong id="profile-ttl">-</strong>
                        </div>
                        <div class="info-item full">
                            <span>Orang Tua</span>
                            <strong id="profile-orangtua">-</strong>
                        </div>
                    </div>

                    <!-- FOOTER -->
                    <div class="profile-actions">
                        <span><i data-lucide="map-pinned"></span>
                        <strong id="profile-alamat">-</strong>
                    </div>

                </div>

            </div>

        </div>

    </div>

</header>

<!-- =========================
     MAIN
========================= -->

<div class="market-layout">

    <!-- =========================
         CONTENT
    ========================= -->

    <main class="market-content">

        <!-- =========================
             STUDENT BANNER
        ========================= -->

        <section class="student-banner">

            <div class="student-left">

                <div class="student-avatar">

                    <i data-lucide="graduation-cap"></i>

                </div>

                <div class="student-info">

                    <small>Data Siswa</small>

                    <h2 id="siswa-nama">
                        -
                    </h2>

                    <div class="student-meta">

                        <span id="siswa-nisn">
                            NISN -
                        </span>

                        <span id="siswa-kelas">
                            Kelas -
                        </span>

                        <span id="siswa-rombel">
                            Rombel -
                        </span>

                    </div>

                </div>

            </div>

            <div
                class="student-status"
                id="siswa-status">

                <span class="status-dot"></span>

                -

            </div>

        </section>

        <!-- =========================
             FILTER
        ========================= -->

        <section class="filter-row">
            <button
                class="filter-chip active"
                data-filter="all">

                Semua

            </button>

            <button
                class="filter-chip"
                data-filter="spp">

                SPP

            </button>

            <button
                class="filter-chip"
                data-filter="pembangunan">

                Pembangunan

            </button>

            <button
                class="filter-chip"
                data-filter="ekstrakurikuler">

                Ekstrakurikuler

            </button>

            <button
                class="filter-chip"
                data-filter="seragam">

                Seragam

            </button>

        </section>

        <!-- =========================
             BILL GRID
        ========================= -->

        <section class="bill-grid"
                id="bill-grid">

            <!-- DIISI VIA JS -->

        </section>

    </main>

</div>

<!-- =========================
     TOAST
========================= -->

<div class="toast-notification"
     id="toast">

    <i data-lucide="check-circle"></i>

    <span>
        Tagihan ditambahkan ke keranjang
    </span>

</div>

<!-- =========================
     SCRIPT
========================= -->

<script src="https://unpkg.com/lucide@latest"></script>

<script>
    lucide.createIcons();
</script>

<script src="{{ url_for('static', filename='js/public/tagihan-siswa.js') }}"></script>

</body>
</html>
